seed: 42

dataset:
  # Mounted path for awsaf49/artifact-dataset on Kaggle
  root: "/kaggle/input/datasets/awsaf49/artifact-dataset"

  index_file: "/kaggle/working/data/artifact_index.csv"
  split_file: "/kaggle/working/data/splits.csv"
  generator_file: "/kaggle/working/data/generators.json"
  report_file: "/kaggle/working/data/dataset_report.json"

  image_size: 224

  train_ratio: 0.80
  validation_ratio: 0.05
  test_ratio: 0.15

  use_all_images: true

hardware:
  # Kaggle NVIDIA T4 (16GB VRAM) optimized settings
  batch_size: 32
  num_workers: 2
  gradient_accumulation_steps: 4

  # Use CUDA GPU on Kaggle
  device: "cuda"

model:
  dino:
    name: "facebook/dinov2-small"

  convnext:
    name: "facebook/convnextv2-tiny-1k-224"

  fusion_dim: 256
  dropout: 0.30

training:
  epochs: 20
  samples_per_epoch: null
  validation_samples: null
  freeze_backbones_epochs: 2

  head_learning_rate: 0.0001
  backbone_learning_rate: 0.000001
  weight_decay: 0.01
  gradient_clip: 1.0
  checkpoint_every_steps: 100
  generator_loss_weight: 0.15

augmentation:
  horizontal_flip: true
  color_jitter: true
  jpeg_augmentation: true

checkpoints:
  directory: "/kaggle/working/checkpoints"
  latest: "/kaggle/working/checkpoints/latest.pt"
  best: "/kaggle/working/checkpoints/best.pt"

logs:
  directory: "/kaggle/working/logs"
  training_file: "/kaggle/working/logs/training.csv"
