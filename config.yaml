seed: 42

dataset:
  root: "./dataset/data"

  index_file: "./data/artifact_index.csv"
  split_file: "./data/splits.csv"
  generator_file: "./data/generators.json"
  report_file: "./data/dataset_report.json"

  image_size: 224

  train_ratio: 0.80
  validation_ratio: 0.05
  test_ratio: 0.15

  # Use every valid image.
  use_all_images: true


hardware:
  batch_size: 16
  num_workers: 0

  # Accumulate gradients so effective batch is larger (8 * 16 = 128).
  gradient_accumulation_steps: 16


model:

  dino:
    name: "facebook/dinov2-small"

  convnext:
    name: "facebook/convnextv2-tiny-1k-224"

  fusion_dim: 256

  dropout: 0.30


training:

  epochs: 20

  # Set to null to train on all 1,997,405 images per epoch.
  samples_per_epoch: null

  # Set to null to validate on all 124,830 validation images.
  validation_samples: null

  # First epochs train the forensic/fusion components.
  freeze_backbones_epochs: 2

  head_learning_rate: 0.0001

  backbone_learning_rate: 0.000001

  weight_decay: 0.01

  gradient_clip: 1.0

  checkpoint_every_steps: 100

  # Auxiliary generator/source classification.
  generator_loss_weight: 0.15


augmentation:

  horizontal_flip: true

  color_jitter: true

  jpeg_augmentation: true


checkpoints:

  directory: "./checkpoints"

  latest: "./checkpoints/latest.pt"

  best: "./checkpoints/best.pt"


logs:

  directory: "./logs"

  training_file: "./logs/training.csv"