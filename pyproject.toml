[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-fusion"
version = "2.0.0"
description = "Leakage-safe real vs AI-generated image training pipeline"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "PyYAML>=6.0,<7",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "Pillow>=10,<13",
  "tqdm>=4.65,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
